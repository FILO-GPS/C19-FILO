name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: FILO checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: filo
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: filo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filo -d filo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://filo:ci_only_password@127.0.0.1:5432/filo_test?schema=public
      LLM_PROVIDER_MODE: mock
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api
      VITE_API_BASE_URL: http://localhost:3001/api
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm exec -w backend -- prisma validate --config prisma.config.ts
      - name: Prepare Prisma when approved migrations exist
        if: ${{ hashFiles('backend/prisma/migrations/**/migration.sql') != '' }}
        run: |
          npm run db:generate
          npm run db:deploy:test
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
